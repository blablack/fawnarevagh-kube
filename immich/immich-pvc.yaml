# Replaces immich-pvc (5Gi): Longhorn can't shrink a volume, so Postgres (~1.2GB) was copied to
# this 2Gi one. The ML model cache moved to the NAS (re-downloadable, 1.7GB). The old
# immich-pvc is left in place (reclaimPolicy Retain, ArgoCD prune is off) until deleted by hand.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-data-pvc
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: "Delete=false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: my-longhorn
  resources:
    requests:
      storage: 2Gi
