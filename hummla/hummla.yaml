apiVersion: apps/v1
kind: Deployment
metadata:
  name: hummla
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: hummla
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hummla
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10001
      volumes:
        - name: hummla-pvc
          persistentVolumeClaim:
            claimName: hummla-pvc
        - name: nasio-nfs-pvc
          persistentVolumeClaim:
            claimName: nasio-nfs-pvc
      containers:
        - image: postgres:17
          imagePullPolicy: Always
          name: postgres
          env:
            - name: POSTGRES_USER
              value: hummla
            - name: POSTGRES_DB
              value: hummla
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hummla
                  key: pg_password
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              subPath: postgresql_17
              name: hummla-pvc
          startupProbe:
            exec:
              command: [pg_isready, -U, hummla, -d, hummla]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: [pg_isready, -U, hummla, -d, hummla]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - su postgres -s /bin/sh -c "PATH=$PATH pg_ctl stop -D $PGDATA -m fast -t 30"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi

        - image: rustfs/rustfs:latest
          imagePullPolicy: Always
          name: rustfs
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: hummla
                  key: s3_access_key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hummla
                  key: s3_secret_key
          volumeMounts:
            - mountPath: /data
              subPath: Kubernetes/Hummla
              name: nasio-nfs-pvc
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi

        - image: nucio.nowhere:30038/hummla:latest
          imagePullPolicy: Always
          name: hummla
          env:
            - name: TZ
              value: "Europe/Dublin"
            - name: HUMMLA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hummla
                  key: database_url
            - name: HUMMLA_STORAGE
              value: s3
            - name: HUMMLA_S3_ENDPOINT
              value: http://localhost:9000
            - name: HUMMLA_S3_BUCKET
              value: hummla
            - name: HUMMLA_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hummla
                  key: s3_access_key
            - name: HUMMLA_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hummla
                  key: s3_secret_key
            - name: HUMMLA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hummla-token
                  key: token
                  optional: true
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hummla
  namespace: default
spec:
  selector:
    app: hummla
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hummla-tls
  namespace: default
spec:
  secretName: hummla-tls
  issuerRef:
    name: blinky-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - hummla.nowhere
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hummla
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    external-dns.kubernetes.io/hostname: hummla.nowhere
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hummla.nowhere
      secretName: hummla-tls
  rules:
    - host: hummla.nowhere
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hummla
                port:
                  number: 80
