---
apiVersion: v1
kind: Service
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  selector:
    app: longhorn-ui
  ports:
    - name: http-80
      protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-tls
  namespace: longhorn-system
spec:
  secretName: longhorn-tls
  issuerRef:
    name: blinky-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - longhorn.nowhere
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    external-dns.kubernetes.io/hostname: longhorn.nowhere
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - longhorn.nowhere
      secretName: longhorn-tls
  rules:
    - host: longhorn.nowhere
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn
                port:
                  number: 80---
# Longhorn >= 1.12's upstream manifest ships NetworkPolicies that only let Longhorn's own pods
# reach longhorn-manager. NetworkPolicies are additive, so this opens just the metrics port to
# Prometheus (monitoring namespace) for the longhorn-prometheus-servicemonitor scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-prometheus
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9500
---
# Let the daily filesystem-trim recurring job (trim-daily) also reclaim space held in the
# backup-monthly snapshot. Without this, blocks freed by the filesystem after a backup stay
# pinned in that snapshot, get coalesced into the next month's snapshot when the old one is
# deleted, and can never be trimmed - Longhorn's actual size drifts well above what the
# filesystem uses (~2.9GiB across all volumes, e.g. registry 3.1GiB actual vs 2.0GiB used).
# Trade-off: the local backup snapshot gets marked removed, so restores come from the NAS
# backup target instead of an in-cluster snapshot.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: remove-snapshots-during-filesystem-trim
  namespace: longhorn-system
value: "true"
---
# Upgrade volume engines live after a Longhorn version bump, one volume per node at a time,
# instead of leaving them on the old engine until upgraded by hand in the UI.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: concurrent-automatic-engine-upgrade-per-node-limit
  namespace: longhorn-system
value: "1"
