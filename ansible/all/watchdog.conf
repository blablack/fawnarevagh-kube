realtime                = yes
priority                = 1

interface = eno1
ping = 192.168.2.1
interval = 30
retry-timeout = 360

# Hardware watchdog (Intel PCH TCO): resets the box if the daemon stops petting it,
# i.e. when the kernel itself is frozen. Needs the iTCO_wdt module (see playbook).
watchdog-device = /dev/watchdog
watchdog-timeout = 60
