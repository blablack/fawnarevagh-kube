# Guards against a MetalLB layer2 failure mode we hit in practice: after both
# speaker pods restart around the same time (e.g. the nightly unattended-upgrades
# reboot of nucio, our only control-plane node), the speaker on the node that
# should have LOST the election can keep answering ARP for a LoadBalancer IP even
# though MetalLB's own controller state (logs, ServiceL2Status) says the correct
# node owns it. That's a wire-vs-control-plane desync, so it's only detectable by
# actually resolving ARP on the LAN and comparing it to who *should* own the IP -
# a check against the Kubernetes API alone would see everything looking fine.
# See the "MetalLB is annoying" investigation in chat history for the full story
# (Jellyfin traffic silently hairpinning through nucio instead of going straight
# to quario, causing 4K direct-play stalls).
#
# Fix on detection: restart the speaker DaemonSet, which cleanly tears down and
# re-creates every speaker's announcer, resolving the desync (confirmed manually).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metallb-speaker-healthcheck
  namespace: metallb-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metallb-speaker-healthcheck
rules:
  # Node is cluster-scoped, so this rule only takes effect via the
  # ClusterRoleBinding below (a namespaced RoleBinding can't grant access to
  # cluster-scoped resources even when it references this ClusterRole).
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Read-only, and scoped to exactly the LoadBalancer services that use
  # externalTrafficPolicy: Local + a single-node nodeSelector today. Add new
  # names here if another app adopts that pattern.
  - apiGroups: [""]
    resources: ["services"]
    resourceNames:
      - jellyfin
      - syncthing-aurelien-sync-tcp
      - syncthing-aurelien-sync-udp
      - syncthing-yvonne-sync-tcp
      - syncthing-yvonne-sync-udp
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  # The actual remediation action, scoped to only the one DaemonSet it's ever
  # allowed to touch.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["speaker"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metallb-speaker-healthcheck
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metallb-speaker-healthcheck
subjects:
  - kind: ServiceAccount
    name: metallb-speaker-healthcheck
    namespace: metallb-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: metallb-speaker-healthcheck
  namespace: metallb-system
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: metallb-speaker-healthcheck
          # Must share the node's real network namespace - the whole point is
          # to see what actually answers ARP on the LAN, which the pod overlay
          # network can't observe.
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          restartPolicy: Never
          containers:
            - name: check
              # Built from docker/metallb-healthcheck/ (curl, jq, iputils-arping
              # baked in) instead of `apk add`-ing them fresh on every run.
              image: nucio.nowhere:30038/metallb-healthcheck:latest
              imagePullPolicy: Always
              securityContext:
                capabilities:
                  add: ["NET_RAW"]
              resources:
                limits:
                  cpu: 200m
                  memory: 128Mi
                requests:
                  cpu: 50m
                  memory: 32Mi
