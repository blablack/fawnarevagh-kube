apiVersion: apps/v1
kind: Deployment
metadata:
  name: hortusfox
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: hortusfox
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hortusfox
    spec:
      terminationGracePeriodSeconds: 60
      volumes:
        - name: hortusfox-pvc
          persistentVolumeClaim:
            claimName: hortusfox-pvc
      containers:
        - image: mariadb:11.4
          imagePullPolicy: Always
          name: mariadb
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: "hortusfox_root"
            - name: MARIADB_DATABASE
              value: "hortusfox"
            - name: MARIADB_USER
              value: "hortusfox"
            - name: MARIADB_PASSWORD
              value: "hortusfox"
          volumeMounts:
            - mountPath: "/var/lib/mysql"
              subPath: "mysql"
              name: hortusfox-pvc
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'mariadb-admin ping -uroot -p"$MARIADB_ROOT_PASSWORD"'
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mariadb-admin ping -uroot -p"$MARIADB_ROOT_PASSWORD"'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
        - image: ghcr.io/danielbrendel/hortusfox-web:latest
          imagePullPolicy: Always
          name: hortusfox
          env:
            - name: APP_ADMIN_EMAIL
              value: "aurelien.leblond@gmail.com"
            - name: APP_ADMIN_PASSWORD
              value: "ChangeMe!2026"
            - name: APP_TIMEZONE
              value: "Europe/Dublin"
            - name: APP_DEBUG
              value: "false"
            - name: APP_UPDATEDEPS
              value: "false"
            - name: APACHE_SERVER_NAME
              value: "hortusfox.nowhere"
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "hortusfox"
            - name: DB_USERNAME
              value: "hortusfox"
            - name: DB_PASSWORD
              value: "hortusfox"
            - name: DB_CHARSET
              value: "utf8mb4"
          volumeMounts:
            - mountPath: "/var/www/html/public/img"
              subPath: "img"
              name: hortusfox-pvc
            - mountPath: "/var/www/html/app/logs"
              subPath: "logs"
              name: hortusfox-pvc
            - mountPath: "/var/www/html/public/backup"
              subPath: "backup"
              name: hortusfox-pvc
            - mountPath: "/var/www/html/public/themes"
              subPath: "themes"
              name: hortusfox-pvc
            - mountPath: "/var/www/html/app/migrations"
              subPath: "migrations"
              name: hortusfox-pvc
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hortusfox
  namespace: default
spec:
  selector:
    app: hortusfox
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hortusfox-tls
  namespace: default
spec:
  secretName: hortusfox-tls
  issuerRef:
    name: blinky-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - hortusfox.nowhere
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hortusfox
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    external-dns.alpha.kubernetes.io/hostname: hortusfox.nowhere
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hortusfox.nowhere
      secretName: hortusfox-tls
  rules:
    - host: hortusfox.nowhere
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hortusfox
                port:
                  number: 80
