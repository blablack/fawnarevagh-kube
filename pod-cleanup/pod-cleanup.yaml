# Graceful Node Shutdown (ansible/all/01-graceful-shutdown.conf) marks every pod
# it stops as phase Failed ("Pod was terminated in response to imminent node
# shutdown"). Deployments replace them, but the dead pod objects linger until
# PodGC's terminated-pod-gc-threshold (12500) is hit - i.e. forever here. Run
# after both nodes' unattended-upgrades reboot windows (06:00 / 06:30) and
# delete them.
# Only Deployment/ReplicaSet-owned pods (they carry pod-template-hash): failed
# Job pods are kept so their logs survive, and StatefulSet/DaemonSet
# controllers already replace their own failed pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-cleanup
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-cleanup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-cleanup
subjects:
  - kind: ServiceAccount
    name: pod-cleanup
    namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-cleanup
  namespace: kube-system
spec:
  schedule: "0 7 * * *"
  timeZone: Europe/Dublin
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pod-cleanup
          containers:
            - name: kubectl
              # Official image, version tags only (no :latest) - keep within one
              # minor of the cluster's k3s version (check-pinned-versions skill).
              image: registry.k8s.io/kubectl:v1.36.5
              imagePullPolicy: Always
              command:
                - kubectl
                - delete
                - pods
                - --all-namespaces
                - --field-selector=status.phase=Failed
                - --selector=pod-template-hash
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                allowPrivilegeEscalation: false
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
          restartPolicy: Never
