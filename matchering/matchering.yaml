apiVersion: v1
kind: ConfigMap
metadata:
  name: matchering-supervisord
  namespace: default
data:
  # Same as the image's baked-in /app/supervisord.conf, except mgweb runs with
  # --noreload: the image otherwise starts Django's dev server (manage.py
  # runserver) with its autoreloader on, which stats the whole source tree
  # every second and burns ~6% of a CPU core even when the app sits idle.
  supervisord.conf: |
    [supervisord]
    nodaemon=true
    user=root

    [program:redis]
    command=redis-server
    autorestart=true
    stdout_logfile=/dev/null
    stdout_logfile_maxbytes=0
    redirect_stderr=true

    [program:mgcore]
    directory=/app
    command=python3 manage.py rqworker default
    autorestart=true
    stdout_logfile=/dev/fd/1
    stdout_logfile_maxbytes=0
    redirect_stderr=true

    [program:mgweb]
    directory=/app
    command=python3 manage.py runserver --noreload 0:8360
    autorestart=true
    stdout_logfile=/dev/fd/1
    stdout_logfile_maxbytes=0
    redirect_stderr=true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchering
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: matchering
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: matchering
    spec:
      volumes:
        - name: nasio-nfs-pvc
          persistentVolumeClaim:
            claimName: nasio-nfs-pvc
        - name: supervisord-conf
          configMap:
            name: matchering-supervisord
      terminationGracePeriodSeconds: 30
      containers:
        - image: sergree/matchering-web
          imagePullPolicy: Always
          name: matchering
          volumeMounts:
            - mountPath: "/app/data"
              subPath: "Kubernetes/Matchering"
              name: nasio-nfs-pvc
            - mountPath: "/app/supervisord.conf"
              subPath: "supervisord.conf"
              name: supervisord-conf
          ports:
            - containerPort: 8360
              name: matchering-web
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Dublin"
          startupProbe:
            httpGet:
              path: /
              port: 8360
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8360
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8360
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            limits:
              cpu: 2000m
              memory: 2000Mi
            requests:
              cpu: 200m
              memory: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: matchering
  namespace: default
spec:
  selector:
    app: matchering
  ports:
    - port: 80
      targetPort: 8360
      protocol: TCP
  type: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: matchering-tls
  namespace: default
spec:
  secretName: matchering-tls
  issuerRef:
    name: blinky-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - matchering.nowhere
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matchering
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    external-dns.kubernetes.io/hostname: matchering.nowhere
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - matchering.nowhere
      secretName: matchering-tls
  rules:
    - host: matchering.nowhere
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: matchering
                port:
                  number: 80

