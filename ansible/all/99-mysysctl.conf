# IPv6 configuration - enables IPv6 on all interfaces
net.ipv6.conf.all.disable_ipv6=0        # Enable IPv6 on all network interfaces
net.ipv6.conf.default.disable_ipv6=0    # Enable IPv6 by default on new interfaces
net.ipv6.conf.lo.disable_ipv6=0         # Enable IPv6 on loopback interface

# Discard core dumps. The kernel default ("core") writes a full memory dump into the crashing
# process's working directory - for a containerized Postgres that's its data dir on the app's
# Longhorn PVC. After the 2026-09-24 WAL-recovery crash loop this left ~1.5GB of core.NN files
# in authentik's and immich's volumes. Nobody reads them here, so drop them at the kernel level.
kernel.core_pattern=|/bin/false

