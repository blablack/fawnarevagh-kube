apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain base (no NFD): both nodes are known, static, and already Intel-iGPU-equipped, so
# NFD's dynamic hardware discovery buys nothing here. This nodeSelects on
# kubernetes.io/arch: amd64 only (satisfied by both nodes) instead of an
# NFD-maintained label. The nfd_labeled_nodes overlay's only other effect
# (-enable-monitoring -v=2 args) was already overridden by our own patch below.
resources:
  - https://github.com/intel/intel-device-plugins-for-kubernetes/deployments/gpu_plugin?ref=v0.36.0

patches:
  - path: intel-gpu-plugin-patch.yaml
    target:
      kind: DaemonSet
      name: intel-gpu-plugin
