# Replaces pihole-pvc (5Gi): Longhorn can't shrink a volume, so the data that has to persist
# (gravity.db, config, certs - ~240MB) was copied to a new 1Gi one. The query history and the
# blocklist cache now live in emptyDirs (see pihole.yaml). The old pihole-pvc is left in
# place (reclaimPolicy Retain, ArgoCD prune is off) until it is deleted by hand.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-data-pvc
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: "Delete=false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: my-longhorn
  resources:
    requests:
      storage: 1Gi
