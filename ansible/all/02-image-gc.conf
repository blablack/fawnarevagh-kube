apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# Start GC at 70% disk usage (vs the default 85%) so old images are cleaned up
# well before the disk pressure threshold (85%) is hit. This gives enough headroom
# for large image pulls (e.g. claude-code at ~3.5GB) to complete before the old
# image is evicted, without triggering disk pressure on nucio's 110GB disk.
imageGCHighThresholdPercent: 70
imageGCLowThresholdPercent: 60
