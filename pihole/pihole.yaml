apiVersion: v1
kind: ConfigMap
metadata:
  name: unbound
  namespace: default
data:
  listening-port.conf: |
    server:
      port: 5335
      verbosity: 2
  dnssec.conf: |
    server:
      module-config: "iterator"
      harden-glue: no
      harden-dnssec-stripped: no
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: pihole
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pihole
        part-of: pihole
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: pihole
      nodeSelector:
        kubernetes.io/hostname: nucio
      containers:
        - name: pihole
          image: pihole/pihole:latest
          imagePullPolicy: Always
          securityContext:
            capabilities:
              add:
                - "NET_ADMIN"
                - "NET_BIND_SERVICE"
                - "NET_RAW"
                - "SYS_NICE"
                - "CHOWN"
                - "SYS_TIME"
          env:
            - name: TZ
              value: "Europe/Dublin"
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  key: password
                  name: pihole-webpassword
            - name: FTLCONF_dns_reply_host_IPv4
              value: '192.168.2.2'
            - name: FTLCONF_dns_reply_host_force4
              value: 'true'
            - name: FTLCONF_misc_dnsmasq_lines
              value: "dns-forward-max=300;bind-interfaces;listen-address=192.168.2.2"
            - name: FTLCONF_RATE_LIMIT
              value: "10000/60"  
            - name: FTLCONF_dns_listeningMode
              value: "BIND"
            # Query history lives in RAM (see ftl-db volume): it was ~1.1GB of replicated
            # Longhorn disk at 91 days, for data that is only graphs. 14 days is ~170MB,
            # which must stay well under the tmpfs sizeLimit. Wiped on every pod restart.
            - name: FTLCONF_files_database
              value: "/ftl-db/pihole-FTL.db"
            - name: FTLCONF_database_maxDBdays
              value: "14"
          startupProbe:
            httpGet:
              path: /admin/login
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /admin/login
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /admin/login
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: pihole-data-pvc
              subPath: "pihole"
              mountPath: "/etc/pihole"
            - name: pihole-data-pvc
              subPath: "pihole-dnsmasq"
              mountPath: "/etc/dnsmasq.d"
            # Downloaded blocklist copies (~83MB): only needed while rebuilding gravity.db,
            # re-fetched on the next gravity update, so no reason to keep them on the PVC.
            - name: lists-cache
              mountPath: "/etc/pihole/listsCache"
            - name: ftl-db
              mountPath: "/ftl-db"
          resources:
            limits:
              cpu: 500m
              memory: 700Mi
            requests:
              cpu: 10m
              memory: 300Mi
        - image: klutchell/unbound:latest
          imagePullPolicy: Always
          name: unbound
          volumeMounts:
            - name: confmap-vol
              subPath: "listening-port.conf"
              mountPath: "/etc/unbound/custom.conf.d/listening-port.conf"
            - name: confmap-vol
              subPath: "dnssec.conf"
              mountPath: "/etc/unbound/custom.conf.d/dnssec.conf"
          startupProbe:
            tcpSocket:
              port: 5335
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 5335
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 5335
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: pihole-data-pvc
          persistentVolumeClaim:
            claimName: pihole-data-pvc
        - name: lists-cache
          emptyDir:
            sizeLimit: 300Mi
        - name: ftl-db
          emptyDir:
            medium: Memory
            sizeLimit: 300Mi
        - configMap:
            name: unbound
          name: confmap-vol
