apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  image: quay.io/prometheus/prometheus:latest
  imagePullPolicy: Always
  nodeSelector:
    kubernetes.io/os: linux
  replicas: 1
  resources:
    limits:
      memory: "2200Mi"
      cpu: "200m"
    requests:
      memory: "1800Mi"
      cpu: "100m"
  securityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
  serviceAccountName: prometheus
  serviceMonitorSelector:
    matchExpressions:
      - key: name
        operator: In
        values:
          - node-exporter
          - longhorn-prometheus-servicemonitor
          - kubelet
          - snmp-exporter
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: prometheus
            topologyKey: kubernetes.io/hostname
  # TSDB lives in RAM on purpose: metrics are expendable and this keeps ~5GiB of replicated
  # Longhorn disk free. History is lost on every pod restart / node reboot. tmpfs counts
  # against the container memory limit, so the limit below = sizeLimit + working set.
  storage:
    emptyDir:
      medium: Memory
      sizeLimit: 1500Mi
  retention: "3d"
  retentionSize: "1GiB"
  walCompression: true
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: web
  selector:
    prometheus: prometheus
  sessionAffinity: ClientIP
