[project]
name = "drumless"
version = "0.1.0"
description = "Upload a song, get it back without the drums (audio-separator + ffmpeg)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "audio-separator[cpu]>=0.44",
    "torch",
    "audioread",  # imported by audio-separator but not declared in its metadata
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[tool.uv]
package = false

# No CUDA on either node: CPU-only wheels avoid ~3 GB of nvidia-* packages.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
