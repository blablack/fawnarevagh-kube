apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-code
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: claude-code
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: claude-code
    spec:
      volumes:
        - name: claude-code-pvc
          persistentVolumeClaim:
            claimName: claude-code-pvc
        - name: nasio-nfs-pvc
          persistentVolumeClaim:
            claimName: nasio-nfs-pvc
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
      nodeSelector:
        kubernetes.io/hostname: nucio
      # Claude has no business talking to the Kubernetes API
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # GID 993 is the kvm group on nucio; gives uid 1000 rw access to /dev/kvm
        supplementalGroups: [993]
      containers:
        - image: nucio.nowhere:30038/claude-code:latest
          imagePullPolicy: Always
          name: claude-code
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["SYS_PTRACE"]
          volumeMounts:
            - mountPath: "/home/claude"
              name: claude-code-pvc
            - mountPath: "/nasio"
              name: nasio-nfs-pvc
              subPath: "Kubernetes/Claude Code"
            - mountPath: /dev/kvm
              name: kvm
          env:
            - name: TZ
              value: "Europe/Dublin"
            - name: CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX
              value: "fawnarevagh"
            # Where Claude drops APKs/files for the user (see docker/claude-code/CLAUDE.md)
            - name: HANDOFF_DIR
              value: "/nasio"
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-code
                  key: gh_token
            # Jenkins API access, to trigger builds and read their console logs
            - name: JENKINS_URL
              value: "http://jenkins.default.svc.cluster.local"
            - name: JENKINS_USER
              valueFrom:
                secretKeyRef:
                  name: claude-code
                  key: jenkins_user
            - name: JENKINS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-code
                  key: jenkins_token
          startupProbe:
            exec:
              command: ["tmux", "has-session", "-t", "claude"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["tmux", "has-session", "-t", "claude"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["tmux", "has-session", "-t", "claude"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 6000m
              memory: 16Gi
            requests:
              cpu: 500m
              memory: 1Gi
