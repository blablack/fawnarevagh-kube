apiVersion: apps/v1
kind: Deployment
metadata:
  name: hortusfox
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: hortusfox
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hortusfox
    spec:
      terminationGracePeriodSeconds: 60
      volumes:
        - name: hortusfox-pvc
          persistentVolumeClaim:
            claimName: hortusfox-pvc
        # Plain app logs - no reason for them to sit on replicated Longhorn storage.
        - name: hortusfox-logs
          emptyDir: {}
      containers:
        - image: mariadb:11.4
          imagePullPolicy: Always
          name: mariadb
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: "hortusfox_root"
            - name: MARIADB_DATABASE
              value: "hortusfox"
            - name: MARIADB_USER
              value: "hortusfox"
            - name: MARIADB_PASSWORD
              value: "hortusfox"
          volumeMounts:
            - mountPath: "/var/lib/mysql"
              subPath: "mysql"
              name: hortusfox-pvc
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'mariadb-admin ping -uroot -p"$MARIADB_ROOT_PASSWORD"'
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mariadb-admin ping -uroot -p"$MARIADB_ROOT_PASSWORD"'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
        - image: ghcr.io/danielbrendel/hortusfox-web:latest
          imagePullPolicy: Always
          name: hortusfox
          env:
            - name: APP_ADMIN_EMAIL
              value: "blablack@gmail.com"
            - name: APP_ADMIN_PASSWORD
              value: "ChangeMe!2026"
            - name: APP_TIMEZONE
              value: "Europe/Dublin"
            # Must stay "true": the image's entrypoint runs its DB migrations
            # and setup through the Asatru CLI, which refuses to run unless
            # APP_DEBUG is enabled ("CLI tool is only available in debug mode").
            - name: APP_DEBUG
              value: "true"
            - name: APP_UPDATEDEPS
              value: "false"
            - name: APACHE_SERVER_NAME
              value: "hortusfox.nowhere"
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "hortusfox"
            - name: DB_USERNAME
              value: "hortusfox"
            - name: DB_PASSWORD
              value: "hortusfox"
            - name: DB_CHARSET
              value: "utf8mb4"
            # Forward-auth via Authentik: trust the X-authentik-* headers that
            # the Traefik forwardAuth middleware injects. Access is enforced at
            # the ingress, so these headers can only come from the outpost.
            - name: PROXY_ENABLE
              value: "true"
            - name: PROXY_OVERWRITE_VALUES
              value: "true"
            - name: PROXY_HEADER_EMAIL
              value: "X-authentik-email"
            - name: PROXY_HEADER_USERNAME
              value: "X-authentik-username"
            - name: PROXY_AUTO_SIGNUP
              value: "true"
          volumeMounts:
            - mountPath: "/var/www/html/public/img"
              subPath: "img"
              name: hortusfox-pvc
            - mountPath: "/var/www/html/app/logs"
              name: hortusfox-logs
            - mountPath: "/var/www/html/public/backup"
              subPath: "backup"
              name: hortusfox-pvc
            - mountPath: "/var/www/html/public/themes"
              subPath: "themes"
              name: hortusfox-pvc
            - mountPath: "/var/www/html/app/migrations"
              subPath: "migrations"
              name: hortusfox-pvc
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          # TCP probes, not HTTP: with PROXY_ENABLE=true the app returns 401 to
          # any request without the X-authentik-* headers (which a kube-probe
          # can't supply), so an httpGet on "/" would always fail. Port 80 being
          # open means Apache/mod_php is up and serving.
          startupProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hortusfox
  namespace: default
spec:
  selector:
    app: hortusfox
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hortusfox-tls
  namespace: default
spec:
  secretName: hortusfox-tls
  issuerRef:
    name: blinky-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - hortusfox.nowhere
  privateKey:
    rotationPolicy: Always
---
# Traefik forward-auth middleware that delegates authentication to the
# Authentik embedded outpost. Reusable by any ingress in the default namespace
# via the annotation: default-authentik-forwardauth@kubernetescrd
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: default
spec:
  forwardAuth:
    address: http://authentik.default.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hortusfox
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-authentik-forwardauth@kubernetescrd
    external-dns.kubernetes.io/hostname: hortusfox.nowhere
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hortusfox.nowhere
      secretName: hortusfox-tls
  rules:
    - host: hortusfox.nowhere
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hortusfox
                port:
                  number: 80
---
# The outpost's auth/callback endpoint must be reachable on the app's own host
# and must NOT go through the forwardAuth middleware (that would loop). The
# longer PathPrefix gives this router priority for /outpost.goauthentik.io.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hortusfox-outpost
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hortusfox.nowhere
      secretName: hortusfox-tls
  rules:
    - host: hortusfox.nowhere
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik
                port:
                  number: 9000
