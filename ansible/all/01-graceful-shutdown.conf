apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# Pods are shut down in ascending priority order, each group getting its own
# slice of time. The plain shutdownGracePeriod/shutdownGracePeriodCriticalPods
# pair only splits pods at priority 2000000000 (system-*-critical), which puts
# Longhorn (longhorn-critical = 1000000000) in the same group as the apps: its
# instance-manager/csi-plugin were killed in parallel with Postgres, the volumes
# went away mid-checkpoint and `pg_ctl stop -m fast` timed out. A separate
# Longhorn group keeps the storage up until the apps have stopped and their
# volumes are unmounted.
# Mutually exclusive with shutdownGracePeriod/shutdownGracePeriodCriticalPods,
# which must stay 0s (k3s's 00-k3s-defaults.conf sets them to 0s; repeated here
# so this file doesn't depend on that).
# The total (110s) must stay <= logind's InhibitDelayMaxSec - see
# unattended-upgrades-logind-maxdelay.conf.
shutdownGracePeriod: 0s
shutdownGracePeriodCriticalPods: 0s
shutdownGracePeriodByPodPriority:
  # Apps - covers terminationGracePeriodSeconds: 60 on the Postgres-sidecar pods
  - priority: 0
    shutdownGracePeriodSeconds: 70
  # longhorn-critical
  - priority: 1000000000
    shutdownGracePeriodSeconds: 30
  # system-cluster-critical / system-node-critical
  - priority: 2000000000
    shutdownGracePeriodSeconds: 10
