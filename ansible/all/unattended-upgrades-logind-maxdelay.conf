# Overrides the unattended-upgrades package's file of the same name in
# /usr/lib/systemd/logind.conf.d/ (InhibitDelayMaxSec=30). logind drop-ins are
# applied in filename order across /etc and /usr/lib, so that file sorted after
# kubelet's own 99-kubelet.conf and silently capped the delay at 30s - kubelet's
# node shutdown manager then refused to start (needs >= shutdownGracePeriod).
[Login]
InhibitDelayMaxSec=90
